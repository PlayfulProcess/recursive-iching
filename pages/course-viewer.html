<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Lenses — The Recursive I Ching</title>
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  /* Layout only — every colour comes from theme.css (the one source). Do not add colour tokens here. */
  html,body{margin:0;background:var(--bg);color:var(--ink);color-scheme:light;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 18px 90px;display:grid;
    grid-template-columns:250px minmax(0,1fr);gap:28px}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr} }

  /* —— sidebar TOC —— */
  aside{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow-y:auto}
  @media (max-width:820px){ aside{position:static;max-height:none} }
  .toc-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:4px 0 10px}
  .toc-back{display:inline-block;font-size:12.5px;color:var(--accent);text-decoration:none;margin-bottom:14px}
  .toc-back:hover{text-decoration:underline}
  .toc{display:flex;flex-direction:column;gap:2px}
  .toc a{display:block;padding:7px 10px;border-radius:3px;text-decoration:none;color:var(--ink-soft);
    font-size:13px;border-left:2px solid transparent}
  .toc a:hover{background:var(--chip,#faf3e6);color:var(--ink)}
  .toc a.active{background:var(--chip,#faf3e6);border-left-color:var(--accent);color:var(--ink);font-weight:600}
  .toc .toc-num{display:inline-block;width:1.4em;color:var(--faint);font-variant-numeric:tabular-nums}
  .toc-sep{border:0;border-top:1px solid var(--line);margin:12px 0}
  .toc-append{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:2px 0 6px}

  /* —— content —— */
  main{min-width:0}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
  h1{font-family:var(--serif-display);font-weight:600;letter-spacing:.02em;font-size:30px;line-height:1.2;margin:8px 0 10px;color:var(--ink)}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .pill{font-size:11.5px;padding:4px 11px;border-radius:999px;background:var(--chip,#faf3e6);
    color:var(--ink-soft);border:1px solid var(--line-soft)}
  .pill.confidence-low{color:var(--later)}

  .content .sec{margin:0 0 22px}
  .content .sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);
    margin:0 0 6px;font-family:Inter,system-ui,sans-serif;font-weight:700}
  .content .sec p{margin:0;font-family:var(--serif-body);font-size:16px;line-height:1.7;color:var(--ink)}

  .companions{margin:26px 0;padding:16px 18px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
  .companions h3{margin:0 0 10px;font-size:14px;color:var(--ink)}
  .clinks{display:flex;flex-wrap:wrap;gap:8px}

  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
  .navbtn{flex:1;max-width:46%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;
    text-decoration:none;color:inherit;background:var(--panel);transition:border-color .15s}
  .navbtn:hover{border-color:var(--accent)}
  .navbtn.next{text-align:right;margin-left:auto}
  .navbtn .dir{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:3px}
  .navbtn .ttl{font-family:var(--serif-display);font-weight:600;font-size:15px}

  .note{margin-top:34px;padding:16px 18px;border:1px dashed var(--line);border-radius:4px;
    background:var(--chip,#f7f3ea);font-size:13.5px;color:var(--muted)}
  .note b{color:var(--ink)}
  a{color:var(--accent)}
  #loading, #err{color:var(--muted);font-size:14px}
  #err{color:var(--bad)}
  .cite{font-size:.85em;color:var(--muted)}
  .cite a{color:inherit}
  .sec.intro{border-left:3px solid var(--accent);padding-left:14px}
  /* —— Markdown tables in a section (odds tables) —— */
  .content .tbl{overflow-x:auto;margin:10px 0 14px}
  .content table{border-collapse:collapse;font-size:14px;min-width:100%}
  .content th,.content td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  .content th{color:var(--ink-soft);font-weight:600;font-size:12.5px}
  .content td{font-variant-numeric:tabular-nums}

  /* —— reading mode: Continuous (default) · One at a time —— */
  .mode-toggle{display:flex;align-items:center;gap:6px;margin:0 0 12px;font-size:12.5px;color:var(--faint)}
  .mode-toggle button{font:inherit;background:none;border:0;padding:3px 2px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
  .mode-toggle button:hover{color:var(--ink)}
  .mode-toggle button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);cursor:default}
  .chapter{margin:0;padding:30px 0 6px;border-top:1px solid var(--line);scroll-margin-top:72px}
  .chapter:first-child{border-top:0;padding-top:0}
  .chapter .ch-title{font-family:var(--serif-display);font-weight:600;letter-spacing:.02em;font-size:25px;line-height:1.25;margin:6px 0 12px}
  .chapter .ch-title a{color:var(--ink);text-decoration:none}
  .chapter .ch-title a:hover{color:var(--accent)}
  .part-sep{margin:34px 0 0;padding:22px 0 0;border-top:3px double var(--line)}
  .part-sep .part-title{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700}
  .part-sep + .chapter{border-top:0}

  /* —— the course's painting, on its first chapter: one public-domain work (img/zen/credits.json) —— */
  .course-art{display:flex;gap:24px;align-items:flex-end;margin:4px 0 30px;padding:0 0 28px;border-bottom:1px solid var(--line)}
  .course-art .mat{flex:0 0 auto}
  .course-art img{max-height:340px;width:auto}
  .course-art.tall img{max-height:560px}
  .course-art figcaption{margin:0;max-width:34ch}
  .course-art.wide{display:block}
  .course-art.wide img{max-height:none;width:100%;max-width:520px}
  .course-art.wide figcaption{max-width:60ch}
  @media (max-width:620px){
    .course-art{flex-direction:column;align-items:center;text-align:center}
    .course-art img{max-height:300px}
    .course-art.tall img{max-height:460px}
  }
</style>
</head>
<body>
<script src="../site-header.js?v=51"></script>
<site-header active="course"></site-header>
<div class="wrap">
  <aside>
    <a class="toc-back" href="../index.html">← Back to the library</a>
    <div class="mode-toggle" id="mode-toggle" role="group" aria-label="How to read the course" hidden>
      <button type="button" data-mode="continuous">Continuous</button><span aria-hidden="true">·</span><button type="button" data-mode="paged">One at a time</button>
    </div>
    <div class="toc-kicker" id="toc-kicker">Three Lenses</div>
    <nav class="toc" id="toc" aria-label="Course chapters"></nav>
  </aside>

  <main>
    <div class="note" id="draft-banner" hidden style="margin:0 0 18px"></div>
    <p id="loading">Loading…</p>
    <p id="err" hidden></p>
    <article id="article" hidden>
      <div class="kicker" id="cintro">Three Lenses · one chapter</div>
      <h1 id="ctitle"></h1>
      <div class="meta-row" id="meta-row"></div>
      <figure class="zen-art course-art" id="course-art" hidden></figure>
      <div class="content" id="content"></div>
      <div class="companions" id="companions" hidden>
        <h3>Read the primary source</h3>
        <div class="clinks" id="clinks"></div>
      </div>
      <nav class="navrow" id="navrow"></nav>
    </article>

    <div class="note" id="course-note"></div>
  </main>
</div>

<!-- Jul 7 2026: the hand-rolled course chat widget (course/course-assistant.js, a
     pattern-copy of recursive-tarot's) is replaced by the ONE shared recursive.eco
     assistant sidebar — ../assistant.js at the bottom of this page — matching how
     recursive.eco's own course viewer mounts it (same star FAB, same tabs, same
     credits). The old widget file stays in the repo one round for easy rollback. -->
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mdLite = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/`(.+?)`/g, '<code>$1</code>');

// Reading mode (Oct 14 2026, PlayfulProcess: "change all courses to continuous"): Continuous is the
// default, the whole course on one page with each chapter's id as its anchor; "One at a time" is the
// old one-chapter-per-page view. A ?mode=paged|continuous URL wins over the choice remembered here.
const MODE_KEY = 'recursive-iching:course-mode';
const MODES = ['continuous', 'paged'];
function storedMode(){ try { const m = localStorage.getItem(MODE_KEY); return MODES.includes(m) ? m : null; } catch (e) { return null; } }
function storeMode(m){ try { localStorage.setItem(MODE_KEY, m); return localStorage.getItem(MODE_KEY) === m; } catch (e) { return false; } }
const urlMode = MODES.includes(params.get('mode')) ? params.get('mode') : null;
const MODE = urlMode || storedMode() || 'continuous';

// Multi-course (ported Jul 2026 from recursive-astrology/pages/course-viewer.html):
// ?course=<slug> picks the manifest + source grammar. This repo ships one course so
// far; the map stays multi-course-shaped so adding a second is one manifest + one
// grammar, no viewer edit.
// `art` names one public-domain painting in ../img/zen/credits.json, shown on the course's
// first chapter (the zen look, Oct 6 2026): Sengai's three shapes for the three lenses, Mu Qi's
// six persimmons (one fruit, six inks) for the translations, and Sesshu's landscape under the
// inscriptions written over it for the books and their commentaries.
const COURSES = {
  'three-lenses': { manifest: '../course/three-lenses.manifest.json', art: 'sengai-circle-triangle-square' },
  'books-of-the-changes': { manifest: '../course/books-of-the-changes.manifest.json', art: 'sesshu-haboku' },
  'translations': { manifest: '../course/translations.manifest.json', art: 'muqi-six-persimmons' },
  'schools-of-the-iching': { manifest: '../course/schools-of-the-iching.manifest.json' },
  'oracle-to-chart': { manifest: '../course/oracle-to-chart.manifest.json' },
  'casting-and-chance': { manifest: '../course/casting-and-chance.manifest.json' },
  'changing-lines-lens': { manifest: '../course/changing-lines-lens.manifest.json' },
};
// The painting for a course, on its first chapter only. Contained, never cropped; the caption names it.
async function showCourseArt(id){
  const fig = $('#course-art');
  if (!id || !fig) return;
  try {
    const credits = await fetch('../img/zen/credits.json').then(r => r.json());
    const w = (credits.works || []).find(x => x.id === id);
    if (!w) return;
    const ratio = w.width / w.height;
    fig.className = 'zen-art course-art' + (ratio > 1.25 ? ' wide' : ratio < .5 ? ' tall' : '');
    fig.innerHTML = `<div class="mat"><img src="../${esc(w.file)}" width="${w.width}" height="${w.height}" alt="${esc(w.alt)}"></div>`
      + `<figcaption>${esc(w.artist.replace(/\s*\(.*\)$/, ''))}, <cite>${esc(w.title)}</cite>, ${esc(w.date.replace(/\s*\(.*\)$/, ''))}. `
      + `${esc(w.collection.replace(/\s*\(.*\)$/, ''))}. Public domain, via `
      + `<a href="${esc(w.commons)}" target="_blank" rel="noopener">Wikimedia Commons</a>.</figcaption>`;
    fig.hidden = false;
  } catch (e) { /* no painting is fine */ }
}
async function main(){
  let manifest, grammar, ids;
  const courseParam = new URLSearchParams(location.search).get('course');
  const courseSlug = COURSES[courseParam] ? courseParam : 'three-lenses';
  const course = COURSES[courseSlug];
  // Every in-course link keeps ?course= (before Oct 4 2026 the TOC dropped it, which only
  // worked because there was one course), and keeps ?mode= when the URL carried one.
  const modeQ = urlMode ? '&mode=' + urlMode : '';
  const chapterHref = id => 'course-viewer.html?course=' + encodeURIComponent(courseSlug) + modeQ + '&chapter=' + encodeURIComponent(id);
  try {
    manifest = await fetch(course.manifest).then(r => { if(!r.ok) throw new Error('manifest '+r.status); return r.json(); });
    // The manifest names its source grammar; fall back to the three-lenses grammar for the default course.
    const grammarSlug = manifest.sourceGrammar || 'three-lenses-64';
    [grammar, ids] = await Promise.all([
      fetch('../grammars/'+grammarSlug+'/grammar.json').then(r => { if(!r.ok) throw new Error('grammar '+r.status); return r.json(); }),
      fetch('../ids.json').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
  } catch (err) {
    $('#loading').hidden = true;
    const e = $('#err'); e.hidden = false;
    e.innerHTML = '<b>Could not load the course.</b> If you opened this file directly, browsers block '
      + '<code>file://</code> fetches — run <code>python -m http.server 8000</code> in the repo root and '
      + 'visit <code>http://localhost:8000/pages/course-viewer.html</code> instead. (On GitHub Pages it just '
      + 'works.) Details: ' + (err && err.message || err);
    return;
  }

  document.title = manifest.title + ' — The Recursive I Ching';
  // The note under the course says where it is read from; a manifest may mark the course a draft.
  const gslug = manifest.sourceGrammar || 'three-lenses-64';
  $('#course-note').innerHTML = '<b>How this works.</b> This ' + (MODE === 'paged' ? 'chapter' : 'course') + ' is read live from <code>grammars/' + esc(gslug)
    + '/grammar.json</code>, the same grammar that sits in <a href="../index.html">the library</a>. Nothing here is duplicated content: edit that grammar and this course updates with it. See <code>course/'
    + esc(courseSlug) + '.manifest.json</code> for the chapter order.'
    + (courseSlug === 'three-lenses' ? ' <b>Note:</b> the source grammar’s chapter items currently carry names and keywords but empty <code>sections</code>, so this course renders honestly empty chapter bodies until that content is written; see the field report for why.' : '');
  if (manifest.draft) { const db = $('#draft-banner'); db.innerHTML = '<b>Draft.</b> ' + esc(manifest.draft); db.hidden = false; }

  // Optional manifest.chapterWhere: { metadataKey: [allowed values] } narrows the chapters
  // (the translations course is the tree's translation nodes only). Chapters follow sort_order.
  const where = manifest.chapterWhere || {};
  const passes = it => Object.entries(where).every(([k, vals]) => vals.includes((it.metadata || {})[k]));
  const chapterItems = grammar.nodes.filter(it => it.id.startsWith(manifest.chapterIdPrefix) && passes(it))
    .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  const BIB = Object.fromEntries((grammar.bibliography || []).map(b => [b.key, b]));
  const appendixItems = grammar.nodes.filter(it => it.id.startsWith(manifest.appendixIdPrefix));
  const allItems = chapterItems.concat(appendixItems);
  const byId = Object.fromEntries(allItems.map(it => [it.id, it]));
  const isAppx = it => it.id.startsWith(manifest.appendixIdPrefix);

  // ?chapter=X, or #X (the anchor the continuous view writes), names the chapter to open or scroll to.
  let hashId = ''; try { hashId = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const requested = params.get('chapter') || hashId;
  const current = byId[requested] || chapterItems[0];
  if (!current) {
    $('#loading').hidden = true;
    $('#err').hidden = false;
    $('#err').textContent = 'This course has no chapters yet.';
    return;
  }

  // —— the mode toggle: remember the choice, then reopen at the same chapter ——
  const toggle = $('#mode-toggle');
  let visibleId = current.id;   // the continuous view keeps this in step with the scroll
  toggle.querySelectorAll('button').forEach(b => {
    const on = b.dataset.mode === MODE;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', () => {
      const m = b.dataset.mode;
      if (m === MODE) return;
      const saved = storeMode(m);
      const q = new URLSearchParams();
      q.set('course', courseSlug);
      if (!saved || urlMode) q.set('mode', m);   // without storage, the URL carries the choice
      if (m === 'paged') q.set('chapter', visibleId);
      location.href = 'course-viewer.html?' + q.toString()
        + (m === 'continuous' && visibleId !== chapterItems[0].id ? '#' + encodeURIComponent(visibleId) : '');
    });
  });
  toggle.hidden = false;

  // —— rendering helpers, shared by both modes ——
  const kickerFor = it => isAppx(it)
    ? (manifest.appendixTitle || 'Patterns across eras') + ' · ' + (manifest.appendixKicker || 'a cross-cutting thread, not a single era')
    : `${manifest.title} · chapter ${chapterItems.findIndex(x => x.id === it.id) + 1} of ${chapterItems.length}`;
  const pillsFor = it => {
    const meta = it.metadata || {};
    let h = '';
    if (meta.when) h += `<span class="pill">${esc(meta.when)}</span>`;
    if (meta.era) h += `<span class="pill">${esc(meta.era)}</span>`;
    if (meta.region) h += `<span class="pill">${esc(meta.region)}</span>`;
    if (meta.stance) h += `<span class="pill">${esc(meta.stance.replace(/-/g,' '))}</span>`;
    if (meta.confidence) h += `<span class="pill confidence-${esc(meta.confidence)}">confidence: ${esc(meta.confidence)}</span>`;
    return h;
  };
  // [@key] citations become links to the grammar's bibliography; blank lines become paragraphs.
  const cite = h => h.replace(/\[@([^\]]+)\]/g, (m, keys) => '<span class="cite">[' + keys.split(';').map(k => {
    k = k.trim().replace(/^@/, ''); const b = BIB[k]; if (!b) return esc(k);
    const label = esc((b.author || k).replace(/\s*\(.*\)/, '') + (b.year ? ' ' + b.year : ''));
    return b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">${label}</a>` : label;
  }).join('; ') + ']</span>');
  const links = h => h.replace(/\[([^\]@][^\]]*)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  // A paragraph whose every line starts with '|' is a Markdown table: a header row, the |---| rule, body rows.
  const isTable = p => { const ls = p.trim().split('\n'); return ls.length > 1 && ls.every(l => l.trim().startsWith('|')); };
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => cite(links(mdLite(c.trim()))));
  const table = p => {
    const [head, ...body] = p.trim().split('\n').filter(l => !/^\|[\s:|-]+\|$/.test(l.trim())).map(cells);
    return '<div class="tbl"><table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>'
      + body.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
  };
  const para = t => String(t).split(/\n{2,}/).map(p => isTable(p) ? table(p)
    : `<p>${cite(links(mdLite(p))).replace(/\n/g, '<br>')}</p>`).join('');
  const bodyFor = (it, withIntro) => {
    const order = isAppx(it) ? (manifest.appendixSectionOrder || []) : (manifest.sectionOrder || []);
    const sections = it.sections || {};
    const keys = order.filter(k => sections[k]).concat(Object.keys(sections).filter(k => !order.includes(k)));
    const meta = it.metadata || {};
    return (withIntro && manifest.intro ? `<div class="sec intro">${para(manifest.intro)}</div>` : '')
      + keys.map(k => `<div class="sec"><h2>${esc(k)}</h2>${para(sections[k])}</div>`).join('')
      + (meta.grammar_slug ? `<p><a class="eco-chip" href="../viewers/cards.html?src=${encodeURIComponent('../grammars/' + meta.grammar_slug + '/grammar.json')}">Open this book in the library →</a></p>` : '');
  };
  // Companion links (primary-source grammars, from ids.json) into `box`; returns how many grammars.
  const fillCompanions = (it, box) => {
    const companionSlugs = (manifest.companions || {})[it.id] || [];
    if (!companionSlugs.length || !ids || !ids.ids) return 0;
    box.innerHTML = '';
    companionSlugs.forEach(slug => {
      // Only a grammar visitors can open on recursive.eco (ids.json's _public_now).
      const uuid = (!Array.isArray(ids._public_now) || ids._public_now.includes(slug)) ? ids.ids[slug] : null;
      const label = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const raw = document.createElement('a');
      raw.className = 'eco-chip'; raw.href = '../grammars/' + slug + '/grammar.json';
      raw.textContent = label + ' — raw JSON';
      box.appendChild(raw);
      if (uuid) {
        // recursive.eco's previews, framed for this collection: ?shell=iching draws the I Ching
        // header and footer once recursive.eco carries it (docs/PARITY-with-recursive-eco-2026-10-07.md);
        // until then the page ignores it. Cards opens at this chapter's hexagram (hex-N -> number N).
        const hexN = (/^hex-(\d+)$/.exec(it.id) || [])[1];
        [['Cards', 'grammar-viewer'], ['Study', 'study-viewer'], ['Tree', 'tree-viewer']].forEach(([lbl, page]) => {
          const a = document.createElement('a');
          a.className = 'eco-chip'; a.target = '_blank'; a.rel = 'noopener';
          a.href = `https://recursive.eco/pages/${page}.html?type=iching&id=${uuid}&shell=iching`
            + (page === 'grammar-viewer' && hexN ? `&hexagram=${hexN}` : '');
          a.textContent = label + ' — ' + lbl;
          box.appendChild(a);
        });
        const play = document.createElement('a');
        play.className = 'eco-chip'; play.target = '_blank'; play.rel = 'noopener';
        play.href = `https://flow.recursive.eco/play?id=${uuid}`;
        play.textContent = label + ' — Play';
        box.appendChild(play);
      }
    });
    return companionSlugs.length;
  };

  // —— sidebar TOC: page links one at a time, anchors on the continuous page ——
  $('#toc-kicker').textContent = manifest.title;
  const toc = $('#toc');
  const tocLink = it => {
    const a = document.createElement('a');
    a.href = MODE === 'paged' ? chapterHref(it.id) : '#' + encodeURIComponent(it.id);
    a.dataset.id = it.id;
    a.className = MODE === 'paged' && it.id === current.id ? 'active' : '';
    return a;
  };
  chapterItems.forEach((it, i) => {
    const a = tocLink(it);
    a.innerHTML = `<span class="toc-num">${i + 1}.</span> ${it.name}`;
    toc.appendChild(a);
  });
  if (appendixItems.length) {
    const hr = document.createElement('hr'); hr.className = 'toc-sep'; toc.appendChild(hr);
    const label = document.createElement('div'); label.className = 'toc-append';
    label.textContent = manifest.appendixTitle || 'Patterns across eras'; toc.appendChild(label);
    appendixItems.forEach(it => {
      const a = tocLink(it);
      a.textContent = it.name;
      toc.appendChild(a);
    });
  }

  if (MODE === 'continuous') {
    // —— the whole course on one page ——
    $('#cintro').textContent = manifest.kicker || manifest.title;
    $('#ctitle').textContent = manifest.title;
    $('#meta-row').hidden = true;
    $('#navrow').hidden = true;
    const content = $('#content');
    content.innerHTML = '';
    let lastWasChapter = true;
    allItems.forEach((it, i) => {
      if (isAppx(it) && lastWasChapter) {
        const sep = document.createElement('div');
        sep.className = 'part-sep';
        sep.innerHTML = `<div class="part-title">${esc(manifest.appendixTitle || 'Patterns across eras')}</div>`
          + (manifest.appendixIntro ? para(manifest.appendixIntro) : '');
        content.appendChild(sep);
      }
      lastWasChapter = !isAppx(it);
      const sec = document.createElement('section');
      sec.className = 'chapter';
      sec.id = it.id;
      const pills = pillsFor(it);
      sec.innerHTML = `<div class="kicker">${esc(kickerFor(it))}</div>`
        + `<h2 class="ch-title"><a href="#${esc(encodeURIComponent(it.id))}">${esc(it.name)}</a></h2>`
        + (pills ? `<div class="meta-row">${pills}</div>` : '')
        + bodyFor(it, i === 0);
      const box = document.createElement('div');
      if (fillCompanions(it, box)) {
        const c = document.createElement('div'); c.className = 'companions';
        c.innerHTML = '<h3>Read the primary source</h3>';
        box.className = 'clinks'; c.appendChild(box); sec.appendChild(c);
      }
      content.appendChild(sec);
    });
    await showCourseArt(course.art);   // before scrolling, so the painting does not push the target down

    // A link inside the course to one of its own chapters scrolls instead of reloading.
    content.addEventListener('click', e => {
      const a = e.target.closest('a[href]');
      if (!a || a.target) return;
      let u; try { u = new URL(a.href, location.href); } catch (err) { return; }
      const ch = u.searchParams.get('chapter');
      if (!/course-viewer\.html$/.test(u.pathname) || (u.searchParams.get('course') || 'three-lenses') !== courseSlug || !ch || !byId[ch]) return;
      e.preventDefault();
      location.hash = encodeURIComponent(ch);
    });

    // The TOC follows the scroll.
    const tocLinks = [...toc.querySelectorAll('a[data-id]')];
    const markActive = id => {
      visibleId = id;
      tocLinks.forEach(a => a.classList.toggle('active', a.dataset.id === id));
    };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) markActive(en.target.id); });
      }, { rootMargin: '-90px 0px -65% 0px' });
      content.querySelectorAll('section.chapter').forEach(s => io.observe(s));
    }
    markActive(current.id);

    $('#loading').hidden = true;
    $('#article').hidden = false;
    // An old ?chapter=X link lands on chapter X; the URL then names it as #X.
    if (requested && byId[requested]) {
      const q = new URLSearchParams(location.search); q.delete('chapter');
      try { history.replaceState(null, '', location.pathname + '?' + q.toString() + '#' + encodeURIComponent(requested)); } catch (e) {}
      document.getElementById(requested).scrollIntoView();
    }
    return;
  }

  // —— one chapter at a time ——
  $('#cintro').textContent = kickerFor(current);
  $('#ctitle').textContent = current.name;
  $('#meta-row').innerHTML = pillsFor(current);
  const first = !isAppx(current) && chapterItems[0] && current.id === chapterItems[0].id;
  if (first) showCourseArt(course.art);
  $('#content').innerHTML = bodyFor(current, first);
  if (fillCompanions(current, $('#clinks'))) $('#companions').hidden = false;

  // —— prev / next ——
  const navrow = $('#navrow');
  const idx = allItems.findIndex(it => it.id === current.id);
  const prev = allItems[idx - 1], next = allItems[idx + 1];
  navrow.innerHTML = '';
  if (prev) {
    const a = document.createElement('a');
    a.className = 'navbtn prev'; a.href = chapterHref(prev.id);
    a.innerHTML = `<span class="dir">← Previous</span><span class="ttl">${esc(prev.name)}</span>`;
    navrow.appendChild(a);
  }
  if (next) {
    const a = document.createElement('a');
    a.className = 'navbtn next'; a.href = chapterHref(next.id);
    a.innerHTML = `<span class="dir">Next →</span><span class="ttl">${esc(next.name)}</span>`;
    navrow.appendChild(a);
  }

  $('#loading').hidden = true;
  $('#article').hidden = false;
}
main();
</script>

<script src="../site-footer.js?v=3"></script>
<script src="../assistant.js?v=2" defer></script>
